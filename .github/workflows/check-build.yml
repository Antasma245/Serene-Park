name: Type-check & build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check project
        run: npx tsc

      - name: Build project
        run: npx vite build
